x-logging: &logging
  logging:
    driver: "json-file"
    options:
      max-size: 10m
      max-file: "5"
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    networks: ["data"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *logging
  # Chạy một lần mỗi lần deploy: áp dụng migration mới rồi thoát. Phải baseline DB prod trước lần chạy đầu tiên.
  migrate:
    image: ghcr.io/amacneil/dbmate@sha256:fb4fe7cabfe98cf864d63ce083867f3c303a8c1a022fcd69081439425706e909
    restart: "no"
    command: ["up"]
    networks: ["data"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./db/migrations:/db/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    <<: *logging
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    mem_limit: 64m
    networks: ["data"]
    command:
      [
        "redis-server",
        "--maxmemory",
        "48mb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--save",
        "",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *logging
  api:
    image: 879601755746.dkr.ecr.ap-southeast-1.amazonaws.com/music-api:1eb83b5
    restart: unless-stopped
    networks: ["data", "app"]
    environment:
      POSTGRES_USER: music_api
      POSTGRES_PASSWORD: ${API_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *logging
  java:
    image: 879601755746.dkr.ecr.ap-southeast-1.amazonaws.com/music-java:1eb83b5
    restart: unless-stopped
    networks: ["data", "app"]
    environment:
      POSTGRES_USER: music_java
      POSTGRES_PASSWORD: ${JAVA_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *logging
  rust:
    image: 879601755746.dkr.ecr.ap-southeast-1.amazonaws.com/music-rust:1eb83b5
    restart: unless-stopped
    networks: ["data", "app"]
    mem_limit: 64m
    environment:
      REDIS_URL: redis://redis:6379
      POSTGRES_USER: music_rust
      POSTGRES_PASSWORD: ${RUST_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      start_period: 10s
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *logging
  python:
    image: 879601755746.dkr.ecr.ap-southeast-1.amazonaws.com/music-python:1eb83b5
    restart: unless-stopped
    networks: ["data", "app"]
    environment:
      POSTGRES_USER: music_python
      POSTGRES_PASSWORD: ${PYTHON_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 128m
    healthcheck:
      start_period: 10s
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *logging
  web:
    image: 879601755746.dkr.ecr.ap-southeast-1.amazonaws.com/music-web:7eb0daf
    restart: unless-stopped
    networks: ["edge"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *logging
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    networks: ["edge", "app"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      java:
        condition: service_healthy
      rust:
        condition: service_healthy
      python:
        condition: service_healthy
    <<: *logging
  certbot:
    image: certbot/certbot
    networks: ["edge"]
    volumes:
      - certbot-www:/var/www/certbot:rw
      - letsencrypt:/etc/letsencrypt:rw
    profiles: ["tools"]
volumes:
  postgres_data:
  certbot-www:
  letsencrypt:
networks:
  edge:
  app:
    internal: true
  data:
    internal: true
