x-logging: &logging
  logging:
    driver: "json-file"
    options:
      max-size: 10m
      max-file: "5"
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./db/postgres:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *logging
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    mem_limit: 64m
    command:
      [
        "redis-server",
        "--maxmemory",
        "48mb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--save",
        "",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *logging
  api:
    image: 879601755746.dkr.ecr.ap-southeast-1.amazonaws.com/music-api@sha256:0833b4d53fc96b70dcd010278666ef740b57fe446c45406e2e557e8f178771c4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *logging
  java:
    image: 879601755746.dkr.ecr.ap-southeast-1.amazonaws.com/music-java@sha256:1ecb706b285204d0e6174c52add9e79bbb623ccbaa7bdfa0a431df9396f282d1
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *logging
  rust:
    image: 879601755746.dkr.ecr.ap-southeast-1.amazonaws.com/music-rust@sha256:483594c678ddc8af66a0946ebf7d2b9a63619b2e26fbd2426125eb050ce9ae39
    restart: unless-stopped
    mem_limit: 64m
    environment:
      REDIS_URL: redis://redis:6379
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      start_period: 10s
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *logging
  python:
    image: 879601755746.dkr.ecr.ap-southeast-1.amazonaws.com/music-python@
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m
    healthcheck:
      start_period: 10s
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *logging
  web:
    image: 879601755746.dkr.ecr.ap-southeast-1.amazonaws.com/music-web@sha256:eab1aabc03821b7eb6d4810850bc128418c19224c11b7cdce5538b862c7390a4
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_healthy
    <<: *logging
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      java:
        condition: service_healthy
      rust:
        condition: service_healthy
      python:
        condition: service_healthy
    <<: *logging
  certbot:
    image: certbot/certbot
    volumes:
      - certbot-www:/var/www/certbot:rw
      - letsencrypt:/etc/letsencrypt:rw
    profiles: ["tools"]
volumes:
  postgres_data:
  certbot-www:
  letsencrypt:
