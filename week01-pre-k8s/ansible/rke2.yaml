# Dựng cụm RKE2: 1 server (rke2-server) + 1 agent (deliver-instance, sau khi tắt Docker).
#
#   ansible-playbook -i inventory.ini rke2.yaml --syntax-check
#   ansible-playbook -i inventory.ini rke2.yaml                  # prereq + server
#   ansible-playbook -i inventory.ini rke2.yaml --tags agent     # tắt Docker + agent (CHỈ chạy khi đã sẵn sàng)
#
# Play `agent` gắn tag `never`: chạy mặc định sẽ bỏ qua, vì nó TẮT Docker và sập web cũ.

- name: Chuẩn bị node cho RKE2 và Longhorn
  hosts: rke2_server:rke2_agent
  become: true
  tasks:
    - name: Cài open-iscsi và nfs-common (Longhorn cần)
      ansible.builtin.apt:
        name:
          - open-iscsi
          - nfs-common
        state: present
        update_cache: true
      register: apt_result
      retries: 3
      delay: 5
      until: apt_result is succeeded

    - name: Bật iscsid
      ansible.builtin.systemd:
        name: iscsid
        state: started
        enabled: true

    - name: Nạp module kernel iscsi_tcp ngay bây giờ
      community.general.modprobe:
        name: iscsi_tcp
        state: present

    - name: Nạp iscsi_tcp mỗi lần boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/iscsi_tcp.conf
        content: "iscsi_tcp\n"
        mode: "0644"

    - name: Loại sd* khỏi multipath (multipathd giữ thiết bị làm Longhorn không mount được)
      ansible.builtin.blockinfile:
        path: /etc/multipath.conf
        marker: "# {mark} ANSIBLE: longhorn"
        block: |
          blacklist {
              devnode "^sd[a-z0-9]+"
          }
      notify: Restart multipathd

    - name: RKE2/kubelet không chạy khi còn swap
      ansible.builtin.assert:
        that: ansible_facts['swaptotal_mb'] == 0
        fail_msg: "Node đang có swap, tắt swap (swapoff -a và sửa /etc/fstab) trước khi cài RKE2."

  handlers:
    - name: Restart multipathd
      ansible.builtin.systemd:
        name: multipathd
        state: restarted

- name: Cài RKE2 server
  hosts: rke2_server
  become: true
  vars:
    rke2_version: "v1.36.6+rke2r1"
  tasks:
    - name: Tạo thư mục config RKE2
      ansible.builtin.file:
        path: /etc/rancher/rke2
        state: directory
        mode: "0755"

    - name: Ghi config.yaml (tls-san để kubectl từ dev box không lỗi chứng chỉ)
      ansible.builtin.copy:
        dest: /etc/rancher/rke2/config.yaml
        mode: "0600"
        content: |
          node-name: rke2-server
          tls-san:
            - {{ inventory_hostname }}
      notify: Restart rke2-server

    - name: Tải script cài RKE2
      ansible.builtin.get_url:
        url: https://get.rke2.io
        dest: /usr/local/bin/rke2-install.sh
        mode: "0755"

    - name: Cài RKE2 (type server, phiên bản ghim)
      ansible.builtin.command: /usr/local/bin/rke2-install.sh
      args:
        creates: /usr/local/bin/rke2
      environment:
        INSTALL_RKE2_TYPE: server
        INSTALL_RKE2_VERSION: "{{ rke2_version }}"

    - name: Bật rke2-server
      ansible.builtin.systemd:
        name: rke2-server
        state: started
        enabled: true

    - name: Chờ token của cụm xuất hiện
      ansible.builtin.wait_for:
        path: /var/lib/rancher/rke2/server/node-token
        timeout: 300

    - name: Tạo thư mục ~/.kube trên dev box
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.kube"
        state: directory
        mode: "0700"
      become: false
      delegate_to: localhost

    - name: Kéo kubeconfig về dev box
      ansible.builtin.fetch:
        src: /etc/rancher/rke2/rke2.yaml
        dest: "{{ lookup('env', 'HOME') }}/.kube/rke2.yaml"
        flat: true

    - name: Trỏ kubeconfig về IP private của server (mặc định là 127.0.0.1)
      ansible.builtin.replace:
        path: "{{ lookup('env', 'HOME') }}/.kube/rke2.yaml"
        regexp: "https://127.0.0.1:6443"
        replace: "https://{{ inventory_hostname }}:6443"
      become: false
      delegate_to: localhost

    - name: Giới hạn quyền kubeconfig (chứa credential admin)
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.kube/rke2.yaml"
        mode: "0600"
      become: false
      delegate_to: localhost

  handlers:
    - name: Restart rke2-server
      ansible.builtin.systemd:
        name: rke2-server
        state: restarted

- name: Tắt Docker và cài RKE2 agent
  hosts: rke2_agent
  become: true
  tags: [agent, never]
  vars:
    rke2_version: "v1.36.6+rke2r1"
    rke2_server_ip: "{{ groups['rke2_server'][0] }}"
  tasks:
    - name: Dừng và tắt Docker (container và iptables của Docker sẽ xung đột với CNI của RKE2)
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - docker.socket
        - docker.service
        - containerd.service
      register: docker_off

    - name: Reboot để xoá sạch rule iptables do Docker để lại
      ansible.builtin.reboot:
      when: docker_off is changed

    - name: Tạo thư mục config RKE2
      ansible.builtin.file:
        path: /etc/rancher/rke2
        state: directory
        mode: "0755"

    - name: Đọc token trực tiếp từ server (play server có thể bị bỏ qua khi chạy --tags agent)
      ansible.builtin.slurp:
        src: /var/lib/rancher/rke2/server/node-token
      delegate_to: "{{ rke2_server_ip }}"
      register: server_token
      no_log: true

    - name: Ghi config.yaml (trỏ về server, kèm token)
      ansible.builtin.copy:
        dest: /etc/rancher/rke2/config.yaml
        mode: "0600"
        content: |
          server: https://{{ rke2_server_ip }}:9345
          token: {{ server_token.content | b64decode | trim }}
          node-name: deliver-instance
      no_log: true
      notify: Restart rke2-agent

    - name: Tải script cài RKE2
      ansible.builtin.get_url:
        url: https://get.rke2.io
        dest: /usr/local/bin/rke2-install.sh
        mode: "0755"

    - name: Cài RKE2 (type agent, phiên bản ghim)
      ansible.builtin.command: /usr/local/bin/rke2-install.sh
      args:
        creates: /usr/local/bin/rke2
      environment:
        INSTALL_RKE2_TYPE: agent
        INSTALL_RKE2_VERSION: "{{ rke2_version }}"

    - name: Bật rke2-agent
      ansible.builtin.systemd:
        name: rke2-agent
        state: started
        enabled: true

  handlers:
    - name: Restart rke2-agent
      ansible.builtin.systemd:
        name: rke2-agent
        state: restarted
