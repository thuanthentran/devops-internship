server {
    listen 80;
    server_name app.lab.thenttthytlu.io.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;      # certbot ghi file thử thách vào đây
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name app.lab.thenttthytlu.io.vn;

    ssl_certificate     /etc/letsencrypt/live/app.lab.thenttthytlu.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.lab.thenttthytlu.io.vn/privkey.pem;

    location / {
        proxy_pass http://web:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }  

    location /api/playlists {
        proxy_pass http://java:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/songs {
        proxy_pass http://rust:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

