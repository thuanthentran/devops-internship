# Workflow tái sử dụng: build image của MỘT service, và (tuỳ chọn) push lên ECR.
# Không tự chạy; chỉ được gọi từ ci.yaml (workflow_call).
name: build-image

on:
  workflow_call:
    inputs:
      app:
        description: "Tên service (thư mục dưới week01-pre-k8s/apps/)"
        required: true
        type: string
      push:
        description: "true: push image lên ECR sau khi build (chỉ dùng sau khi merge vào main)"
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: build (${{ inputs.app }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # cần cho OIDC; bước dùng nó chỉ chạy khi push=true
    env:
      APP: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@v6

      # Build luôn chạy (PR và main). Tag cục bộ, chưa gắn tên registry.
      - name: Build image
        run: docker build -t "music-${APP}:${GITHUB_SHA}" "week01-pre-k8s/apps/${APP}"

      # Từ đây trở xuống chỉ chạy khi được yêu cầu push VÀ đang ở nhánh main.
      - name: Configure AWS credentials
        if: inputs.push && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ap-southeast-1
          role-to-assume: arn:aws:iam::879601755746:role/github-actions-ecr

      - name: Login to Amazon ECR
        id: login-ecr
        if: inputs.push && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push to ECR
        if: inputs.push && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE="${REGISTRY}/music-${APP}:${GITHUB_SHA}"
          docker tag "music-${APP}:${GITHUB_SHA}" "${IMAGE}"
          docker push "${IMAGE}"
