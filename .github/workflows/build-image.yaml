# Workflow tái sử dụng: build image của MỘT service, và (tuỳ chọn) push lên ECR.
# Không tự chạy; chỉ được gọi từ ci.yaml (workflow_call).
name: build-image

on:
  workflow_call:
    inputs:
      version:
        description: "Semver (không có chữ v); rỗng nếu build thường"
        required: false
        type: string
        default: ""
      app:
        description: "Tên service"
        required: true
        type: string
      push:
        description: "true: push image lên ECR sau khi build (chỉ dùng sau khi merge vào main)"
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: build (${{ inputs.app }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # cần cho OIDC; bước dùng nó chỉ chạy khi push=true
    env:
      APP: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@v6
      - name: Compute tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${VERSION}" ]; then
            echo "TAG=${VERSION}" >> "$GITHUB_ENV"
          else
            echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
      - name: Select build context
        run: |
          case "${APP}" in
            postgres) echo "CONTEXT=week01-pre-k8s/db/postgres" >> "$GITHUB_ENV" ;;
            *)        echo "CONTEXT=week01-pre-k8s/apps/${APP}" >> "$GITHUB_ENV" ;;
          esac

      # Build luôn chạy (PR và main). Tag cục bộ, chưa gắn tên registry.
      - name: Build image
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "music-${APP}:${TAG}" "${CONTEXT}"

      - name: Configure AWS credentials
        if: inputs.push && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ap-southeast-1
          role-to-assume: arn:aws:iam::879601755746:role/github-actions-ecr

      - name: Login to Amazon ECR
        id: login-ecr
        if: inputs.push && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push to ECR
        if: inputs.push && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE="${REGISTRY}/music-${APP}:${TAG}"
          docker tag "music-${APP}:${TAG}" "${IMAGE}"
          docker push "${IMAGE}"
