name: learn-github-actions
run-name: CI Build for app-api and app-web
on:
  push:
    branches: 
      - 'week01/**'
      - main
permissions: 
  id-token: write 
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix: 
        app: [api, web]
    steps:
      - name: Configure AWS Credentials for Singapore region
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ap-southeast-1
          role-to-assume: arn:aws:iam::879601755746:role/github-actions-ecr
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: actions/checkout@v6
      - run: docker build -t ${{ steps.login-ecr.outputs.registry }}/music-${{ matrix.app }}:${{ github.sha }} week01-pre-k8s/apps/${{ matrix.app }}
      - name: Push to ECR
        run: docker push ${{ steps.login-ecr.outputs.registry }}/music-${{ matrix.app }}:${{ github.sha }}
